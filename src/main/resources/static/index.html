<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work Time Off</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    #dashboard { margin-top: 20px; }
    form label { display:block; margin-bottom:8px; }
    #topBar { display:flex; justify-content:space-between; align-items:center; }
    #logoutBtn { margin-left: 10px; }
    .small { font-size:0.9em; color:#555; }
  </style>
</head>
<body>
  <div id="app">
    <div id="loginPanel">
      <h2>Login</h2>
      <form id="loginForm">
        <label>Email: <input type="email" name="email" required /></label>
        <label>Password: <input type="password" name="password" required minlength="8" /></label>
        <button type="submit">Login</button>
      </form>
    </div>

    <div id="dashboard" style="display:none;">
      <div id="topBar">
        <h2>Dashboard</h2>
        <div>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>

      <div id="showDashboard"></div>

      <h3>My Requests</h3>
      <table id="myTable" class="display" style="width:100%">
        <thead>
          <tr><th>ID</th><th>Type</th><th>Start</th><th>End</th><th>Partial</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Apply for Time Off</h3>
      <form id="applyForm">
        <label>Type:
          <select name="type">
            <option value="VACATION">Vacation</option>
            <option value="SICK">Sick</option>
            <option value="PERSONAL">Personal</option>
          </select>
        </label>
        <label>Start Date: <input type="date" name="startDate" required /></label>
        <label>End Date: <input type="date" name="endDate" required /></label>
        <label>Partial Day: <input type="text" name="partialDay" placeholder="e.g. morning" /></label>
        <button type="submit">Apply</button>
      </form>

      <div id="managerSection" style="display:none;">
        <h3>Team Requests</h3>
        <table id="teamTable" class="display" style="width:100%">
          <thead>
            <tr><th>ID</th><th>User</th><th>Type</th><th>Start</th><th>End</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    // Expose a promise that resolves when the CSRF endpoint completes.
    window.csrfReady = fetch('/api/csrf', { credentials: 'same-origin', cache: 'no-store' })
      .then(function(){ return true; })
      .catch(function(){ return true; });
  </script>

  <script src="/showDashboard.js"></script>
  <script src="/main.js"></script>
</body>
</html>
