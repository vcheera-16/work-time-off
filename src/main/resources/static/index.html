<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work Time Off</title>
  <link rel="stylesheet" href="/static/main.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Work Time Off</h1>
    </header>

    <main>
      <section id="auth">
        <h2>Login</h2>
        <form id="loginForm">
          <label>Email: <input type="email" name="email" required></label><br>
          <label>Password: <input type="password" name="password" required></label><br>
          <button type="submit">Login</button>
        </form>
      </section>

      <section id="dashboard" style="display:none">
        <h2>Dashboard</h2>
        <div>
          <a href="#" id="showRequestForm">Request Time Off</a> |
          <a href="#" id="showRequests">My Requests</a> |
          <a href="#" id="showTeam" style="display:none">Team Approvals</a>
        </div>

        <div id="requestFormContainer" style="display:none; margin-top:10px;">
          <h3>New Time Off Request</h3>
          <form id="requestForm">
            <label>Type:
              <select name="type">
                <option value="VACATION">Vacation</option>
                <option value="SICK">Sick</option>
                <option value="UNPAID">Unpaid</option>
              </select>
            </label><br>
            <label>Start: <input type="date" name="startDate" required></label><br>
            <label>End: <input type="date" name="endDate" required></label><br>
            <label>Partial: <select name="partialDay"><option value="">None</option><option value="AM">AM</option><option value="PM">PM</option></select></label><br>
            <button type="submit">Submit Request</button>
          </form>
        </div>

        <div id="calendar"></div>
        <div id="requestsTableContainer" style="display:none; margin-top:10px;">
          <table id="requestsTable" class="display" style="width:100%">
            <thead>
              <tr><th>ID</th><th>Type</th><th>Start</th><th>End</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="teamTableContainer" style="display:none; margin-top:10px;">
          <h3>Team Approvals</h3>
          <table id="teamTable" class="display" style="width:100%">
            <thead>
              <tr><th>ID</th><th>User ID</th><th>Type</th><th>Start</th><th>End</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
