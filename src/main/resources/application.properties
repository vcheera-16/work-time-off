# Security notes

# Ensure TLS in production; configure session cookie properties via server settings or reverse proxy
server.servlet.session.cookie.http-only=true
# Set secure=true in production when running over TLS
# server.servlet.session.cookie.secure=true

# Database (update for your env)
spring.datasource.url=jdbc:postgresql://localhost:5432/work_time_off
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
