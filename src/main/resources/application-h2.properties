# H2 in-memory profile for quick local development
# Use: mvn spring-boot:run -Dspring-boot.run.profiles=h2   OR
# export SPRING_PROFILES_ACTIVE=h2 and run the app

spring.datasource.url=jdbc:h2:mem:work_time_off;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema for H2 profile (skip Flyway to avoid dialect issues)
spring.jpa.hibernate.ddl-auto=create
spring.flyway.enabled=false

# H2 console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# keep default logging
logging.level.org.springframework=INFO
